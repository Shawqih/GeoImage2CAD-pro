name: GeoImage2CAD Pro Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.22.1'
  OPENCV_VERSION: '4.10.0'

jobs:
  build-web-and-apk:
    runs-on: ubuntu-latest
    env:
      HAS_PROD_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run deterministic filter benchmark
        run: npm run benchmark:filters

      - name: Validate standard DXF export
        run: npm run validate:dxf

      - name: Build web bundle
        run: npm run build

      - name: Copy web bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}"

      - name: Download OpenCV Android SDK
        run: |
          curl -L --fail --retry 3 -o /tmp/opencv-android-sdk.zip \
            "https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-android-sdk.zip"
          unzip -q /tmp/opencv-android-sdk.zip -d /tmp
          echo "OPENCV_ANDROID_SDK=/tmp/OpenCV-android-sdk" >> "$GITHUB_ENV"

      - name: Prepare production signing
        if: ${{ env.HAS_PROD_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/geoimage2cad-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/geoimage2cad-release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/geoimage2cad-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK contains Native Core
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libgeoimage2cad.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libopencv_java4.so'
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RELEASE_APK"

      - name: Verify production signature when configured
        if: ${{ env.HAS_PROD_SIGNING == 'true' }}
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RELEASE_APK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geoimage2cad-android10-final-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
